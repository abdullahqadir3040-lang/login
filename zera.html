
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.Aamir yousuf</title>
        <link rel="icon" href="gh.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: url('https://plus.unsplash.com/premium_photo-1681255760839-6581e2eb3e96?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D') no-repeat center;
    background-size: cover;
}

/* Header */
header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 20px 100px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 99;
}

.logo {
    color: #fff;
    font-size: 2em;
}

.navigation a {
    position: relative;
    font-size: 1.1em;
    color: #fff;
    text-decoration: none;
    font-weight: 500;
    margin-left: 30px;
}

.navigation a::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: -6px;
    width: 100%;
    height: 3px;
    background: #fff;
    border-radius: 5px;
    transform: scaleX(0);
    transition: transform .5s;
}

.navigation a:hover::after {
    transform: scaleX(1);
}

/* Login Button */
.btnlogin-popup {
    width: 130px;
    height: 50px;
    background: transparent;
    border: 2px solid #fff;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1.1em;
    color: #fff;
    margin-left: 30px;
    transition: .5s;
}

.btnlogin-popup:hover {
    background: #fff;
    color: #06436f;
}

/* Login and Register Wrapper */
.wrapper {
    position: relative;
    width: 400px;
    min-height: 450px;
    background: transparent;
    border: 2px solid rgba(255,255,255,.5);
    border-radius: 20px;
    backdrop-filter: blur(20px);
    box-shadow: 0 0 30px rgba(0,0,0,.5);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    transform: scale(0);
    transition: transform .3s ease;
    z-index: 100;
}

.wrapper.active-popup {
    transform: scale(1);
}

/* Form Boxes */
.form-box {
    width: 100%;
    padding: 40px;
}

.form-box.register {
    display: none;
}

.wrapper.active .form-box.login {
    display: none;
}

.wrapper.active .form-box.register {
    display: block;
}

.form-box h2 {
    font-size: 2em;
    color: #fff;
    text-align: center;
}

/* Close Button */
.wrapper .close-icon {
    position: absolute;
    top: 0;
    right: 0;
    width: 40px;
    height: 40px;
    background: #feffff;
    color: #000000;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    border-bottom-left-radius: 20px;
    font-size: 2em;
    z-index: 1;
}

/* Input Boxes */
.input-box {
    position: relative;
    width: 100%;
    height: 50px;
    border-bottom: 2px solid #fff;
    margin: 30px 0;
}

.input-box input {
    width: 100%;
    height: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font-size: 1em;
    padding: 0 30px 0 5px;
    font-weight: 600;
}

.input-box label {
    position: absolute;
    top: 50%;
    left: 5px;
    transform: translateY(-50%);
    color: #fff;
    pointer-events: none;
    transition: .5s;
}

.input-box input:focus ~ label,
.input-box input:valid ~ label {
    top: -5px;
}

.input-box .icon {
    position: absolute;
    right: 8px;
    font-size: 1.2em;
    color: #fdf9f9;
    line-height: 57px;
}

/* Remember and Forgot */
.remember-forgot {
    font-size: .9em;
    font-weight: 200;
    display: flex;
    justify-content: space-between;
    margin: -15px 0 15px;
    color: #fefcfc;
}

.remember-forgot label input {
    accent-color: #f9fafb;
    margin-right: 3px;
}

.remember-forgot a {
    color: #fdfeff;
    text-decoration: none;
}

.remember-forgot a:hover {
    text-decoration: underline;
}

/* Form Buttons */
.btn {
    width: 100%;
    height: 45px;
    background: #ffffff;
    border: none;
    outline: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1em;
    color: #000000;
    font-weight: 500;
}

.btn:hover {
    background: #000000;
    color: #faf8f8;
}

/* Login and Register Links */
.login-register {
    font-size: .9em;
    color: #fff;
    text-align: center;
    margin: 25px 0 10px;
}

.login-register a {
    color: #fff;
    font-weight: 600;
    text-decoration: none;
}

.login-register a:hover {
    text-decoration: underline;
}

/* Contact Popup */
.contact-popup {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 350px;
    max-width: calc(100% - 30px);
    padding: 50px 25px;
    background: transparent;
    border: 2px solid rgba(255,255,255,.6);
    border-radius: 20px;
    text-align: center;
    color: white;
    box-shadow: 0 0 30px rgba(0,0,0,.5);
    backdrop-filter: blur(20px);
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
    visibility: hidden;
    transition: .4s ease;
    z-index: 200;
}

.contact-popup.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
    visibility: visible;
}

.contact-info h2 {
    font-size: 25px;
    margin-bottom: 20px;
}

.contact-info p {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 1px;
}

/* Contact Close Button */
.contact-close {
    position: absolute;
    top: 0;
    right: 0;
    width: 40px;
    height: 40px;
    background: #fff;
    color: #06436f;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 25px;
    cursor: pointer;
    border-bottom-left-radius: 15px;
    border-top-right-radius: 18px;
}

/* Mobile Screen */
@media (max-width: 768px) {
    header {
        padding: 15px 20px;
        flex-direction: column;
        gap: 15px;
    }

    .logo {
        font-size: 1.5em;
    }

    .navigation {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .navigation a {
        margin-left: 0;
        font-size: .9em;
    }

    .btnlogin-popup {
        margin-left: 0;
        width: 90px;
        height: 40px;
    }

    .wrapper {
        width: 350px;
        max-width: calc(100% - 30px);
    }
}

</style>
</head>
<body>

    <header>
        <h2 class="logo">M. Aamir Yousuf</h2>

        <nav class="navigation">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#" class="contact-link">Contact</a>
            <button type="button" class="btnlogin-popup">Login</button>
        </nav>
    </header>

    <!-- Contact Popup -->
    <div class="contact-popup">
        <span class="contact-close">
            <ion-icon name="close"></ion-icon>
        </span>

        <div class="contact-info">
            <h2>M. Aamir Yousuf</h2>
            <p>0334-3040756</p>
        </div>
    </div>

    <!-- Login and Register Popup -->
    <div class="wrapper">

        <span class="close-icon">
            <ion-icon name="close"></ion-icon>
        </span>

        <!-- Login Form -->
        <div class="form-box login">
            <h2>Login</h2>

            <form>
                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="mail"></ion-icon>
                    </span>
                    <input type="email" required>
                    <label>Email</label>
                </div>

                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="lock-closed"></ion-icon>
                    </span>
                    <input type="password" required>
                    <label>Password</label>
                </div>

                <div class="remember-forgot">
                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="btn">Login</button>

                <div class="login-register">
                    <p>
                        Don't have an account?
                        <a href="#" class="register-link">Register</a>
                    </p>
                </div>
            </form>
        </div>

        <!-- Register Form -->
        <div class="form-box register">
            <h2>Registration</h2>

            <form>
                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="person"></ion-icon>
                    </span>
                    <input type="text" required>
                    <label>Username</label>
                </div>

                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="mail"></ion-icon>
                    </span>
                    <input type="email" required>
                    <label>Email</label>
                </div>

                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="lock-closed"></ion-icon>
                    </span>
                    <input type="password" required>
                    <label>Password</label>
                </div>

                <div class="remember-forgot">
                    <label>
                        <input type="checkbox" required>
                        I agree to the terms and conditions
                    </label>
                </div>

                <button type="submit" class="btn">Register</button>

                <div class="login-register">
                    <p>
                        Already have an account?
                        <a href="#" class="login-link">Login</a>
                    </p>
                </div>
            </form>
        </div>

    </div>

    <!-- Icons -->
    <script type="module"
        src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js">
    </script>
<script>

// تمام ضروری HTML عناصر منتخب کریں
const wrapper = document.querySelector('.wrapper');

const loginLink = document.querySelector('.login-link');
const registerLink = document.querySelector('.register-link');

const loginPopup = document.querySelector('.btnlogin-popup');
const closeIcon = document.querySelector('.close-icon');

const contactLink = document.querySelector('.contact-link');
const contactPopup = document.querySelector('.contact-popup');
const contactClose = document.querySelector('.contact-close');


// Login بٹن دبانے پر Login Popup کھولیں
loginPopup.addEventListener('click', function() {
    contactPopup.classList.remove('show');
    wrapper.classList.add('active-popup');
    wrapper.classList.remove('active');
});


// Register لنک دبانے پر Register فارم کھولیں
registerLink.addEventListener('click', function(e) {
    e.preventDefault();
    wrapper.classList.add('active');
});


// Login لنک دبانے پر Login فارم کھولیں
loginLink.addEventListener('click', function(e) {
    e.preventDefault();
    wrapper.classList.remove('active');
});


// Login Popup بند کریں
closeIcon.addEventListener('click', function() {
    wrapper.classList.remove('active-popup');
    wrapper.classList.remove('active');
});


// Contact پر کلک کرنے سے Contact Popup کھولیں
contactLink.addEventListener('click', function(e) {
    e.preventDefault();

    wrapper.classList.remove('active-popup');
    wrapper.classList.remove('active');

    contactPopup.classList.add('show');
});


// Contact کا کراس دبانے سے Popup بند کریں
contactClose.addEventListener('click', function() {
    contactPopup.classList.remove('show');
});


// Escape بٹن دبانے سے دونوں Popup بند کریں
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        wrapper.classList.remove('active-popup');
        wrapper.classList.remove('active');
        contactPopup.classList.remove('show');
    }
});
</script>

    <script nomodule
        src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js">
    </script>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
